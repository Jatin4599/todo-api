trigger:
  branches:
    include:
      - main

variables:
  acrName: 'todoapijatin4599'
  acrLoginServer: 'todoapijatin4599.azurecr.io'
  imageName: 'todo-api'
  imageTag: '$(Build.BuildId)'

stages:
- stage: Test
  displayName: 'Test'
  jobs:
  - job: RunTests
    displayName: 'Install and Test'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js 20'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm test
      displayName: 'Run tests'

- stage: Build
  displayName: 'Build and Push'
  dependsOn: Test
  jobs:
  - job: BuildPush
    displayName: 'Build and Push to ACR'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Build and Push to ACR'
      inputs:
        containerRegistry: 'todo-api-acr'
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(imageTag)
          latest